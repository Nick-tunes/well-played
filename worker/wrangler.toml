name = "wellplayed-api"
main = "src/index.js"
compatibility_date = "2024-11-01"
workers_dev = false
routes = [
  { pattern = "api.well-played.win", custom_domain = true },
  # Same-origin API for the site itself: no extra DNS lookup or CORS to fail.
  { pattern = "well-played.win/api/*", zone_name = "well-played.win" },
  { pattern = "www.well-played.win/api/*", zone_name = "well-played.win" },
]

[[d1_databases]]
binding = "DB"
database_name = "wellplayed"
database_id = "730d8c09-e615-4c9b-9e5e-db977174ba2e"

[vars]
ALLOWED_ORIGINS = "https://well-played.win,https://www.well-played.win,https://well-played-2bw.pages.dev,https://nick-tunes.github.io,http://localhost:5173"
